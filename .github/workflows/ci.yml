name: CI

# Offline build and tests only. No secrets, no network beyond the loopback mocks, nothing is published.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      # The live suite (sandbox) is gated on SOLARI_LIVE, which is not set here.
      - name: go test
        run: go test ./...
